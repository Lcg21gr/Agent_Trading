{
  "$kind": "http-request",
  "method": "GET",
  "url": "{{baseUrl}}/v1/demo/symbols/:symbolId/quote",
  "description": "Fresh bid and ask with broker timestamps",
  "headers": {
    "Accept": "application/json"
  },
  "order": 2000,
  "pathVariables": [
    {
      "key": "symbolId",
      "value": "1"
    }
  ],
  "auth": {
    "type": "bearer",
    "credentials": {
      "token": "{{bearerToken}}"
    }
  }
}
